name: Verify and deploy AudioBrain to AWS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audiobrain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify and build application
        run: npm run verify
      - name: Build public artifact and component catalog
        run: npm run build:deploy
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm run test:e2e
      - name: Verify deployable artifact
        run: |
          test -f dist/index.html
          test -f dist/build.json
          test -f dist/storybook/index.html
          test -f dist/storybook/iframe.html
          test -f dist/storybook/index.json
          npm run check:storybook-dist
      - uses: actions/upload-artifact@v7
        with:
          name: audiobrain-site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deployment-not-configured:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (vars.AWS_ACCOUNT_ID == '' || vars.AWS_DEPLOY_ROLE_ARN == '' ||
       vars.AWS_SITE_BUCKET == '' || vars.AWS_CLOUDFRONT_DISTRIBUTION_ID == '')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Report publication configuration
        run: |
          echo '::warning::AudioBrain verified; deployment not configured. Set the four verified AudioBrain AWS repository variables described in infra/README.md.'
          echo 'AudioBrain verified; deployment not configured. No site was published.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AWS_ACCOUNT_ID != '' && vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_SITE_BUCKET != '' && vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://audiobrain.org
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: audiobrain-site
          path: site
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: audiobrain-${{ github.run_id }}
      - name: Publish verified artifact and check public site
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          AWS_SITE_BUCKET: ${{ vars.AWS_SITE_BUCKET }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: bash scripts/deploy-aws-site.sh site
      - name: Install public browser acceptance runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify published instruments in Chromium
        env:
          PLAYWRIGHT_BASE_URL: https://audiobrain.org
        run: npm run test:e2e
